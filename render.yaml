services:
  - type: web
    name: note-expenses-backend
    env: node
    plan: free
    buildCommand: pnpm install && npx prisma generate && pnpm run build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: note-expenses-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: note-expenses-db
    plan: free
    databaseName: note_expenses
    user: admin
